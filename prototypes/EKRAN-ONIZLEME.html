  function render(){
    root.dataset.layout=state.layout;root.dataset.orderMode=state.orderMode;layout.value=state.layout;
    root.querySelectorAll('[data-view]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.view===state.view)));
    content.innerHTML=state.view==='tables'?tableCards():state.view==='order'?orderHtml():state.view==='kitchen'?kitchenHtml():paymentHtml();
    if(state.view==='payment'){const form=content.querySelector('#nc-payment-form');const raw=paymentInput();for(const key of ['amount','customer','collector'])form.elements[key].value=raw[key];updatePaymentPreview();}
  }
  function parseAmount(value){const s=String(value).trim().replace(',','.');if(!/^\d+(\.\d{1,2})?$/.test(s))return NaN;return Math.round(Number(s)*100);}
  function paymentValues(){const form=content.querySelector('#nc-payment-form');if(!form)return null;return {amount:parseAmount(form.elements.amount.value),customer:form.elements.customer.value,collector:form.elements.collector.value};}
  function capturePaymentInput(){const form=content.querySelector('#nc-payment-form');if(!form)return;const raw=paymentInput();for(const key of ['amount','customer','collector'])raw[key]=form.elements[key].value;}
  function updatePaymentPreview(){
    const raw=paymentInput(),table=selected(),choice=selectedPaymentItems(table,raw),form=content.querySelector('#nc-payment-form');if(!form)return;
    if(raw.mode==='items'){raw.amount=amountText(choice.amount);form.elements.amount.value=raw.amount;content.querySelector('#nc-payment-selection').textContent=choice.error||choice.parts.length+' ürün satırı seçildi';}
    const p=paymentValues();content.querySelector('#nc-after-payment').textContent=Number.isFinite(p.amount)?money(remaining(table)-p.amount):'Tutarı kontrol edin';
    content.querySelectorAll('[data-pay-method]').forEach(button=>{button.dataset.paySelection=selectionKey(choice);button.disabled=paymentPending||remaining(table)===0||table.lines.some(l=>l.status==='draft')||raw.mode==='items'&&(Boolean(choice.error)||choice.amount<=0);});
    content.querySelectorAll('[data-pay-line]').forEach(input=>{input.checked=Number(raw.items[input.dataset.payLine])>0;});
  }
  function recordPayment(method,expected){
    if(state.view!=='payment'||paymentPending||!['cash','card','debt'].includes(method))return false;
    const table=selected(),p=paymentValues(),error=content.querySelector('#nc-payment-error'),raw=paymentInput();
    if(table.lines.some(l=>l.status==='draft')){error.textContent='Önce gönderilmemiş ürünleri tamamlayın.';return false;}
    if(remaining(table)===0){error.textContent='Hesap zaten kapandı.';return false;}
    if(!expected||expected.payRef!==accountKey(table)||Number(expected.payDue)!==remaining(table)||Number(expected.payCount)!==table.payments.length){render();content.querySelector('#nc-payment-error').textContent='Hesap değişti. Güncel kalan tutarı kontrol ederek ödeme yöntemini yeniden seçin.';return false;}
    if(!p||!Number.isFinite(p.amount)||p.amount<=0){error.textContent='Sıfırdan büyük, en fazla iki ondalıklı tutar girin.';return false;}
    if(p.amount>remaining(table)){error.textContent='Girilen tutar kalan hesaptan büyük olamaz.';return false;}
    if(method==='debt'&&!p.customer){error.textContent='Veresiye için müşteri seçin.';return false;}
    if((expected.payMode||'amount')!==raw.mode){error.textContent='Ödeme seçimi değişti. Güncel seçimi kontrol edin.';return false;}
    let items=[];
    if(raw.mode==='items'){
      const choice=selectedPaymentItems(table,raw);
      if(choice.error||choice.amount<=0||p.amount!==choice.amount||expected.paySelection!==selectionKey(choice)){error.textContent=choice.error||'Ürün seçimi değişti. Miktarları ve toplamı yeniden kontrol edin.';return false;}
      items=choice.parts;
    }else if(p.amount===remaining(table)&&unassignedPayment(table)===0){
      items=table.lines.filter(line=>!['draft','cancelled'].includes(line.status)&&openQty(table,line)>0).map(line=>itemShare(table,line,openQty(table,line)));
      if(items.reduce((sum,item)=>sum+item.amount,0)!==p.amount){error.textContent='Ürün payları değişti. Hesabı yeniden kontrol edin.';return false;}
    }
    paymentPending=true;
    table.payments.push({cash:method==='cash'?p.amount:0,card:method==='card'?p.amount:0,debt:method==='debt'?p.amount:0,customer:method==='debt'?p.customer:'',collector:p.collector,items});
    state.paymentInputs[paymentKey()]=newPaymentInput(remaining(table),p.collector,raw.mode);
    render();persist();announce((method==='cash'?'Nakit':method==='card'?'POS':'Veresiye')+' '+money(p.amount)+' kaydedildi. '+(remaining(table)===0?'Hesap kapandı.':'Kalan: '+money(remaining(table))));
    setTimeout(()=>{paymentPending=false;if(state.view==='payment')render();},700);
    return true;
  }
  root.addEventListener('click',event=>{
    const button=event.target.closest('button');if(!button||button.disabled)return;
    if(button.dataset.paymentMode){
      if(paymentPending||!['amount','items'].includes(button.dataset.paymentMode))return;
      if(button.dataset.paymentMode==='items'&&(unassignedPayment(selected())>0||remaining(selected())===0||selected().lines.some(l=>l.status==='draft')))return;
      capturePaymentInput();const raw=paymentInput();raw.mode=button.dataset.paymentMode;raw.items={};raw.amount=amountText(remaining(selected()));raw.auto=true;render();return;
    }
    if(button.dataset.favorite){
      const id=button.dataset.favorite,product=products.find(p=>p.id===id);if(!product)return;
      const wasFavorite=state.favorites.includes(id);state.favorites=wasFavorite?state.favorites.filter(value=>value!==id):state.favorites.concat(id);
      rememberFavorites();updateCatalog();persist();
      (content.querySelector('[data-favorite="'+id+'"]')||content.querySelector('[data-product-filter="favorites"]'))?.focus({preventScroll:true});
      announce(product.name+(wasFavorite?' ortak favorilerden çıkarıldı.':' ortak favorilere eklendi.'));return;
    }
    if(button.dataset.productFilter){state.favoritesOnly=button.dataset.productFilter==='favorites';updateCatalog();persist();return;}
    if(button.dataset.payMethod){if(event.detail>1)return;recordPayment(button.dataset.payMethod,button.dataset);return;}
    if(button.dataset.view){go(button.dataset.view);return;}
    if(button.dataset.table){const table=state.tables.find(t=>t.id===Number(button.dataset.table));if(!table)return;state.table=table.id;go('order');return;}
    if(button.dataset.product){
      const product=products.find(p=>p.id===button.dataset.product);if(!product)return;
      if(product.variants){state.picker=product.id;state.variant=0;state.orderMode='products';render();return;}
      state.picker=null;if(addDraft(product,null,1)){render();persist();announce(product.name+' bir adet eklendi. Tekrar tıklayarak artırabilirsiniz.');}return;
    }
    if(button.dataset.quickVariant!==undefined){
      const product=products.find(p=>p.id===state.picker);const index=Number(button.dataset.quickVariant),variant=product?.variants?.[index];if(!variant)return;
      state.variant=index;state.orderMode='products';
      if(variant.weighed){render();announce('Tartılan gramı girin; her tartım ayrı eklenir.');return;}
      if(addDraft(product,variant,1)){render();persist();announce(product.name+' · '+variant.name+' bir adet eklendi.');}return;
    }
    if(button.dataset.qtyLine){
      const line=selected().lines.find(l=>l.id===Number(button.dataset.qtyLine));if(!line||line.status!=='draft'||weighed(line))return;
      const qty=line.qty+Number(button.dataset.delta);if(!Number.isInteger(qty)||qty<0||qty>10000)return;
      if(qty===0)selected().lines=selected().lines.filter(l=>l.id!==line.id);else line.qty=qty;
      render();persist();announce(qty===0?'Taslak satırı kaldırıldı.':'Taslak miktarı güncellendi.');return;
    }
    if(button.dataset.editNote){state.noteLine=Number(button.dataset.editNote);render();return;}
    if(button.dataset.saveNote){const line=selected().lines.find(l=>l.id===Number(button.dataset.saveNote));if(!line||line.status!=='draft')return;line.note=content.querySelector('#nc-line-note').value.trim().slice(0,120);state.noteLine=null;render();persist();announce('Sipariş notu kaydedildi.');return;}
    if(button.dataset.remove){const table=selected();table.lines=table.lines.filter(l=>!(l.id===Number(button.dataset.remove)&&l.status==='draft'));render();persist();announce('Gönderilmemiş ürün kaldırıldı.');return;}
    if(button.dataset.progress||button.dataset.deliver){const id=Number(button.dataset.progress||button.dataset.deliver);const line=allAccounts().flatMap(t=>t.lines).find(l=>l.id===id);if(line){line.status={new:'cooking',cooking:'ready',ready:'delivered'}[line.status]||line.status;render();persist();announce(line.name+': '+labels[line.status]);}return;}
    if(button.dataset.cancel){state.cancelLine=Number(button.dataset.cancel);render();return;}
    if(button.dataset.approveCancel){
      const line=selected().lines.find(l=>l.id===Number(button.dataset.approveCancel));const reason=content.querySelector('#nc-cancel-reason').value.trim();const error=content.querySelector('#nc-cancel-error');
      if(!reason){error.textContent='İptal nedenini girin.';return;}
      if(!line||['draft','cancelled'].includes(line.status))return;
      if(settledQty(selected(),line)>0){error.textContent='Bu ürün için ödeme kaydı var. İptal öncesinde ilgili ödemenin iade/düzeltme işlemi gerekir.';return;}
      if(total(selected())-lineTotal(line)<allocated(selected())){error.textContent='Bu iptal, hesabı alınmış ödemenin altına indiriyor. İade işlemi ayrıca ele alınmalı.';return;}
      line.cancellation={reason,effect:line.status==='new'?'Hazırlık başlamadı · tüketim oluşmadı':'Hazırlanan ürün · fire değerlendirmesi gerekir'};line.status='cancelled';state.cancelLine=null;render();persist();announce('Örnek sorumlu onayıyla iptal kaydedildi; neden hesapta korundu.');return;
    }
    const action=button.dataset.action;
    if(action==='clear-product-search'){state.search='';updateCatalog();content.querySelector('#nc-product-search').focus();return;}
    if(action==='clear-product-filters'){state.search='';state.category='Tümü';state.favoritesOnly=false;updateCatalog();content.querySelector('#nc-product-search').focus();persist();return;}
    if(action==='open-transfer'){if(!selected().lines.length||closedAccount())return;state.transfer={source:selected().id,ref:accountKey(selected()),target:null,merge:false};state.picker=null;state.noteLine=null;state.cancelLine=null;render();return;}
    if(action==='cancel-transfer'){state.transfer=null;render();return;}
    if(action==='confirm-transfer'){if(!moveAccount()){const error=content.querySelector('#nc-transfer-error');if(error)error.textContent='Hedef masayı ve birleştirme seçimini kontrol edin.';}return;}
    if(action==='show-products'){state.orderMode='products';render();return;}
    if(action==='show-account'){state.orderMode='account';render();return;}
    if(action==='new-account'){
      const table=selected();if(remaining(table)>0||table.lines.some(l=>l.status==='draft'))return;
      state.closed.push({id:table.id,name:table.name,number:table.number||1,ref:accountKey(table),lines:table.lines,payments:table.payments});emptyTable(table);state.orderMode='account';render();persist();announce('Önceki hesap korundu. Bu masa için yeni adisyon açıldı.');return;
    }
    if(action==='close-picker'){state.picker=null;render();return;}
    if(action==='add-picked'){
      const product=products.find(p=>p.id===state.picker);const variant=product?.variants?.[state.variant];
      const qty=Number(content.querySelector('#nc-quantity').value);
      if(!product||!Number.isInteger(qty)||qty<1||qty>10000){content.querySelector('#nc-picker-error').textContent='Geçerli bir miktar girin (1–10000).';return;}
      const note=content.querySelector('#nc-product-note').value.trim().slice(0,120);
      if(!addDraft(product,variant,qty,note))return;
      delete state.pickInputs[pickKey()];state.orderMode='products';render();persist();announce('Ürün taslağa eklendi. Adisyona dönerek miktarları kontrol edip gönderebilirsiniz.');return;
    }
    if(action==='send'){
      const lines=selected().lines.filter(l=>l.status==='draft');if(!lines.length)return;
      lines.forEach(l=>l.status=l.prep?'new':'delivered');state.noteLine=null;render();persist();announce('Örnek sipariş kaydedildi. Hazırlanacak ürünler mutfak/bar listesinde, tüm ürünler masa hesabında.');
    }
  });
  root.addEventListener('change',event=>{
    if(event.target.dataset?.payLine){
      if(paymentPending||paymentInput().mode!=='items')return;const line=selected().lines.find(l=>l.id===Number(event.target.dataset.payLine));if(!line||['draft','cancelled'].includes(line.status))return;
      paymentInput().items[line.id]=event.target.checked?(weighed(line)?openQty(selected(),line):Math.min(1,openQty(selected(),line))):0;render();content.querySelector('[data-pay-line="'+line.id+'"]')?.focus({preventScroll:true});return;
    }
    if(event.target.dataset?.payQty){if(paymentPending||paymentInput().mode!=='items')return;paymentInput().items[event.target.dataset.payQty]=event.target.value;updatePaymentPreview();return;}
    if(event.target.id==='nc-transfer-target'&&state.transfer){state.transfer.target=Number(event.target.value)||null;state.transfer.merge=false;render();return;}
    if(event.target.id==='nc-merge-ack'&&state.transfer){state.transfer.merge=event.target.checked;render();return;}
    if(event.target.dataset?.weightLine){
      const line=selected().lines.find(l=>l.id===Number(event.target.dataset.weightLine));if(!line||line.status!=='draft'||!weighed(line))return;
      const qty=Number(event.target.value);if(!Number.isInteger(qty)||qty<1||qty>10000){event.target.value=String(line.qty);announce('Geçerli bir gram miktarı girin (1–10000).');return;}
      line.qty=qty;render();persist();announce('Tartılan ağırlık ve tutar güncellendi.');return;
    }
    if(event.target===layout){state.layout=layout.value;render();persist();}
    if(event.target.id==='nc-category'){state.category=event.target.value;updateCatalog();persist();}
    if(event.target.id==='nc-variant'){const note=pickInput().note;state.variant=Number(event.target.value);if(!pickInput().note)pickInput().note=note;render();}
    if(event.target.closest('#nc-payment-form')){if(event.target.name==='amount')paymentInput().auto=false;capturePaymentInput();updatePaymentPreview();}
  });
  root.addEventListener('input',event=>{
    if(event.target.dataset?.payQty){if(paymentPending||paymentInput().mode!=='items')return;paymentInput().items[event.target.dataset.payQty]=event.target.value;updatePaymentPreview();return;}
    if(event.target.id==='nc-product-search'){state.search=event.target.value.slice(0,100);updateCatalog();return;}
    if(event.target.id==='nc-line-note'){const line=selected().lines.find(l=>l.id===state.noteLine);if(line?.status==='draft')line.note=event.target.value.slice(0,120);}
    if(event.target.id==='nc-quantity')pickInput().qty=event.target.value;
    if(event.target.id==='nc-product-note')pickInput().note=event.target.value;
    if(event.target.closest('#nc-payment-form')){if(event.target.name==='amount')paymentInput().auto=false;capturePaymentInput();updatePaymentPreview();}
  });
  root.addEventListener('toggle',event=>{if(state.view==='payment'&&event.target.id==='nc-credit-details')paymentInput().creditOpen=event.target.open;},true);
  root.addEventListener('submit',event=>{
    if(event.target.id!=='nc-payment-form')return;event.preventDefault();
    content.querySelector('#nc-payment-error').textContent='Ödeme yöntemini Nakit veya POS düğmesiyle seçin; veresiye için müşteri hesabı bölümünü kullanın.';
  });
  render();
  if(globalThis.Tweak){const design={density:'comfortable'};const tweak=new Tweak({container:root,onChange:()=>{root.dataset.density=design.density;}});tweak.addSelect(design,'density',{label:'Satır aralığı',options:[{label:'Rahat',value:'comfortable'},{label:'Kompakt',value:'compact'}]});}
})();
</script>

</body></html>
